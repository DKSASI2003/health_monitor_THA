apiVersion: v1
kind: Secret
metadata:
  name: {{ include "health-check-service.postgresqlSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "health-check-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  password: {{ .Values.postgresql.password | quote }}
