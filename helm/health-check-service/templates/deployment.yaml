apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "health-check-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "health-check-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "health-check-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "health-check-service.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.postgresql.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "health-check-service.postgresqlName" . }} -p {{ .Values.postgresql.service.port }} -U {{ .Values.postgresql.username }}; do echo "waiting for PostgreSQL"; sleep 2; done
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "health-check-service.postgresqlSecretName" . }}
                  key: password
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgresql.username }}:$(POSTGRES_PASSWORD)@{{ include "health-check-service.postgresqlName" . }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.database }}"
            - name: SCHEDULER_ENABLED
              value: {{ .Values.app.env.schedulerEnabled | quote }}
            - name: HTTP_TIMEOUT_SECONDS
              value: {{ .Values.app.env.httpTimeoutSeconds | quote }}
            - name: MAX_CONCURRENCY
              value: {{ .Values.app.env.maxConcurrency | quote }}
            - name: MAX_CHECKS_PER_SECOND
              value: {{ .Values.app.env.maxChecksPerSecond | quote }}
            - name: CHECK_RESULT_RETENTION_DAYS
              value: {{ .Values.app.env.checkResultRetentionDays | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
